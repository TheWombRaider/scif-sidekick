version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Toolchain and serialization are upgraded by hand with the lockfile and verification metadata.
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.android.application"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization*"
      # Major bumps on the Gmail path are upgraded by hand once they can be tested on a real phone.
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.android.gms:play-services-auth"
        update-types: ["version-update:semver-major"]
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
